{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h1 class="h3 mb-4">User management</h1>
<div class="card mb-4" style="max-width: 760px;"><div class="card-header fw-semibold">Add user</div><div class="card-body">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label" for="u-name">Username</label><input class="form-control" id="u-name" autocomplete="off"></div>
    <div class="col-md-4"><label class="form-label" for="u-pass">Password</label><input class="form-control" id="u-pass" type="password" autocomplete="new-password"></div>
    <div class="col-md-4"><label class="form-label" for="u-role">Role</label><select class="form-select" id="u-role"><option value="operator">Operator</option><option value="admin">Administrator</option></select></div>
  </div>
  <div class="form-text">Password: at least 8 characters with a letter and a digit.</div>
  <button class="btn btn-primary mt-3" id="u-add" type="button">Add user</button></div></div>
<div class="card"><div class="table-responsive"><table class="table mb-0 align-middle">
  <thead><tr><th>Username</th><th>Role</th><th>Created</th><th class="text-end">Actions</th></tr></thead>
  <tbody id="u-list"></tbody></table></div></div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  async function load() {
    try {
      const d = await DBSafe.api('/api/users');
      $('u-list').innerHTML = d.items.map(u => `<tr><td>${DBSafe.esc(u.username)}</td>
        <td>${DBSafe.esc(u.role)}</td><td>${DBSafe.esc(u.created_at)}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-secondary" data-act="role" data-id="${u.id}" data-role="${u.role === 'admin' ? 'operator' : 'admin'}">Make ${u.role === 'admin' ? 'operator' : 'admin'}</button>
          <button class="btn btn-sm btn-outline-secondary" data-act="pw" data-id="${u.id}">Reset password</button>
          <button class="btn btn-sm btn-outline-danger" data-act="del" data-id="${u.id}">Delete</button></td></tr>`).join('');
    } catch (e) { DBSafe.toast(e.message, 'danger'); }
  }
  $('u-add').addEventListener('click', async () => {
    try {
      await DBSafe.api('/api/users', {method: 'POST', body: {username: $('u-name').value, password: $('u-pass').value, role: $('u-role').value}});
      $('u-name').value = ''; $('u-pass').value = ''; DBSafe.toast('User added', 'success'); load();
    } catch (e) { DBSafe.toast(e.message, 'danger'); }
  });
  $('u-list').addEventListener('click', async ev => {
    const b = ev.target.closest('button[data-act]'); if (!b) return;
    const id = b.dataset.id;
    try {
      if (b.dataset.act === 'del') { if (!confirm('Delete this user?')) return; await DBSafe.api('/api/users/' + id, {method: 'DELETE'}); }
      else if (b.dataset.act === 'role') await DBSafe.api('/api/users/' + id, {method: 'PUT', body: {role: b.dataset.role}});
      else { const pw = prompt('New password (min 8 chars, letter + digit):'); if (!pw) return; await DBSafe.api('/api/users/' + id, {method: 'PUT', body: {password: pw}}); }
      DBSafe.toast('Done', 'success'); load();
    } catch (e) { DBSafe.toast(e.message, 'danger'); }
  });
  load();
});
</script>
{% endblock %}
