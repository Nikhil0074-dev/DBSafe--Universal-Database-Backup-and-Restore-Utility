{% extends "base.html" %}
{% block title %}Storage{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Backup storage</h1>
  {% if user.role == 'admin' %}<button class="btn btn-outline-primary" id="cleanup-btn" type="button">Apply retention now</button>{% endif %}
</div>
<div class="card mb-4"><div class="card-body">
  <div class="d-flex justify-content-between mb-1"><span>Used <strong id="st-used">–</strong> of <strong id="st-total">–</strong></span><span>Available <strong id="st-free">–</strong></span></div>
  <div class="progress" style="height: 24px"><div class="progress-bar" id="st-bar" style="width:0%">0%</div></div>
</div></div>
<div class="card"><div class="card-header fw-semibold">Storage by database</div>
  <div class="table-responsive"><table class="table mb-0"><thead><tr><th>Database</th><th>Backups</th><th>Storage</th></tr></thead>
  <tbody id="st-list"><tr><td colspan="3" class="text-muted">Loading…</td></tr></tbody></table></div></div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id);
  async function load() {
    try {
      const s = await DBSafe.api('/api/storage');
      $('st-used').textContent = DBSafe.fmtBytes(s.used);
      $('st-total').textContent = DBSafe.fmtBytes(s.total);
      $('st-free').textContent = DBSafe.fmtBytes(s.free);
      const bar = $('st-bar');
      bar.style.width = Math.min(s.percent_used, 100) + '%';
      bar.textContent = s.percent_used + '%';
      bar.className = 'progress-bar ' + (s.percent_used >= s.warn_percent ? 'bg-danger' : s.percent_used >= 70 ? 'bg-warning' : 'bg-success');
      $('st-list').innerHTML = s.by_database.length ? s.by_database.map(r =>
        `<tr><td>${DBSafe.esc(r.database)}</td><td>${r.backups}</td><td>${DBSafe.fmtBytes(r.size)}</td></tr>`).join('')
        : '<tr><td colspan="3" class="text-muted">No backups yet.</td></tr>';
    } catch (e) { DBSafe.toast(e.message, 'danger'); }
  }
  const btn = $('cleanup-btn');
  if (btn) btn.addEventListener('click', async () => {
    if (!confirm('Delete scheduled backups that fall outside their retention policy?')) return;
    try { const r = await DBSafe.api('/api/storage/cleanup', {method: 'POST', body: {}});
      DBSafe.toast(`Removed ${r.removed} expired backup(s)`, 'success'); load(); }
    catch (e) { DBSafe.toast(e.message, 'danger'); }
  });
  load();
});
</script>
{% endblock %}
